services:
  db:
    image:  mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    container_name: user_manage_mssql
    hostname: mssql_host
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -P ${MSSQL_PASSWORD} -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - user_manage_db:/var/opt/mssql

  api1:
    build:
      context: ./api
      target: final
    ports:
      - "10.94.217.151:80:8080"
    hostname: api1_server
    environment: &api_env
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - JwtConfig__Issuer=${JwtConfig__Issuer}
      - JwtConfig__Audience=${JwtConfig__Audience}
      - JwtConfig__Secret=${JwtConfig__Secret}
      - JwtConfig__AccessTokenExpirationMinutes=${JwtConfig__AccessTokenExpirationMinutes}
      - JwtConfig__RefreshTokenExpirationDays=${JwtConfig__RefreshTokenExpirationDays}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: on-failure:10

  api2:
    build:
      context: ./api
      target: final
    ports:
      - "10.94.217.152:80:8080"
    hostname: api2_server
    environment: *api_env
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: on-failure:10

  api3:
    build:
      context: ./api
      target: final
    ports:
      - "10.94.217.153:80:8080"
    hostname: api3_server
    environment: *api_env
    depends_on:
      db:
        condition: service_healthy
        restart: true
    restart: on-failure:10

volumes:
  user_manage_db: